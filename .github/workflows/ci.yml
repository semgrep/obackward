name: CI

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  build-and-test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest = x86_64 glibc, ubuntu-24.04-arm = aarch64 glibc,
        # macos-latest = aarch64 darwin (Apple Silicon).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@e32b06a3e831ff2fbc6f08cf35be2085e3918014 # v3.6.1
        with:
          ocaml-compiler: "5.3"

      - name: Install dependencies
        run: opam install . --deps-only --with-test --yes

      - name: Build
        run: opam exec -- dune build

      - name: Run tests
        run: opam exec -- dune runtest

  build-and-test-alpine:
    name: build & test (alpine, musl)
    # NOTE: GitHub-hosted arm64 runners + alpine containers + JS actions
    # (actions/checkout, setup-* actions) do not work — GitHub does not
    # ship an arm64-alpine node20 binary, so the runner aborts with
    # "JavaScript Actions in Alpine containers are only supported on x64
    # Linux runners". arm64 musl coverage is therefore omitted; arm64 is
    # still tested via the main matrix (glibc) and macos-latest (darwin).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ocaml/opam:alpine-ocaml-5.3@sha256:d58182f2f8be08ecff74a4d5286c5987eaf55299f9b13db3a6178744209c6aae
      options: --user root
    env:
      # The pre-built switch lives under the `opam` user's home; running as
      # root means we have to point opam at it explicitly.
      OPAMROOT: /home/opam/.opam
    steps:
      - name: Install Alpine system deps
        run: |
          apk add --no-cache \
            build-base pkgconf bash git \
            elfutils-dev \
            libunwind-dev \
            zstd-dev \
            bzip2-dev \
            xz-dev

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Trust workspace as git
        run: git config --global --add safe.directory '*'

      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test --yes

      - name: Build
        run: opam exec -- dune build

      - name: Run tests
        run: opam exec -- dune runtest
